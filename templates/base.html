<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Multi-Agent Market Analyst{% endblock %}</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a22;
    --panel-2: #1a2330;
    --border: #263140;
    --text: #e7edf3;
    --muted: #93a4b8;
    --accent: #3ddc97;
    --accent-2: #5b8def;
    --warn: #e8b339;
    --danger: #e8596b;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  header.top .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; }
  header.top .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  header.top nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; margin-left: 18px; }
  header.top nav a:hover { color: var(--text); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
  }
  .card h2, .card h3 { margin-top: 0; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }

  form.analyze-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.8rem; color: var(--muted); }
  input[type=text], select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; min-width: 180px;
  }
  button {
    background: var(--accent); color: #06231a; border: none; font-weight: 700;
    padding: 11px 20px; border-radius: 8px; cursor: pointer; font-size: 0.95rem;
  }
  button:hover { filter: brightness(1.08); }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
  .badge.low { background: rgba(61,220,151,0.15); color: var(--accent); }
  .badge.medium { background: rgba(232,179,57,0.15); color: var(--warn); }
  .badge.high { background: rgba(232,89,107,0.15); color: var(--danger); }
  .badge.rec-strongbuy, .badge.rec-buy, .badge.rec-accumulate { background: rgba(61,220,151,0.15); color: var(--accent); }
  .badge.rec-holdwatch { background: rgba(232,179,57,0.15); color: var(--warn); }
  .badge.rec-reduce, .badge.rec-avoidsell { background: rgba(232,89,107,0.15); color: var(--danger); }
  .badge.rec-insufficientdata { background: rgba(147,164,184,0.15); color: var(--muted); }
  .warning-list { margin: 0; padding-left: 18px; color: var(--warn); font-size: 0.88rem; }
  .chart-card canvas { max-height: 320px; }

  .report { white-space: pre-wrap; font-size: 0.97rem; }
  .error { color: var(--danger); margin-bottom: 14px; }
  .agent-pipeline { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  .agent-pipeline span { background: var(--panel-2); border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px; }
  a.back { color: var(--accent-2); text-decoration: none; font-size: 0.9rem; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot"></span> Multi-Agent Market Analyst</div>
    <nav>
      <a href="/">Home</a>
      <a href="/compare">Compare</a>
      <a href="/screener">Screener</a>
      <a href="/history">Run history (JSON)</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
  <footer>Data from free/unofficial sources. Not financial advice.</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
